# Render Blueprint: https://render.com/docs/blueprint-spec
# One-click deploy: New → Blueprint → point at this repo. Render prompts for every `sync: false` value.
services:
  - type: web
    name: deepretain
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # MongoDB Atlas (required). Allow Render's outbound IPs (or 0.0.0.0/0) in Atlas → Network Access.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: deepretain
      - key: ATLAS_VECTOR_INDEX
        value: concept_embedding_index

      # AI. Signed-in learners bring their own free Google AI Studio key (Gemma 4, gemma-4-26b-a4b-it),
      # so there is no server-wide key. Without one, a reachable Ollama server is used, then the offline grader.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:e4b
      - key: OLLAMA_EMBED_MODEL
        value: all-minilm

      # Auth0 (optional; leave blank to run in Demo Mode only). APP_BASE_URL defaults to RENDER_EXTERNAL_URL;
      # don't set it to localhost (it's ignored on Render).
      # Authorize the app for the Auth0 Management API (read:users, update:users_app_metadata) so learners can save
      # AI keys and have their settings, devices and progress follow them across devices.
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_SECRET
        generateValue: true
      - key: AUTH0_MANAGEMENT_DOMAIN
        sync: false

      # Study pacing and judge access. DAILY_COGNITIVE_CAP is the starting daily limit;
      # each learner can pick 5-25 in Settings.
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: DAILY_COGNITIVE_CAP
        value: "15"
